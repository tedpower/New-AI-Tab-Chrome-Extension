<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>New Tab</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <form id="promptWrapper">
      <textarea
        id="promptInput"
        placeholder="Ask anything..."
        rows="2"
      ></textarea>
      <div id="sendWrap" style="display: none">
        <button id="send">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
    </form>

    <div id="controlPanel">
      <button id="infoButton">?</button>
      <select id="assistantSelect">
        <option value="claude">Claude</option>
        <option value="chatgpt">ChatGPT</option>
        <option value="gemini">Gemini</option>
      </select>
    </div>

    <dialog id="infoModal">
      <div>Built by TP</div>
      <button id="closeInfo">Close</button>
    </dialog>

    <script src="settings-utils.js"></script>
    <script src="newtab-page.js"></script>
  </body>
</html>
